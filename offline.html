<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <title>Tangle-me — You're offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .logo {
      font-size: 56px;
      margin-bottom: 8px;
      display: block;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      opacity: 0.95;
    }

    .wifi-icon {
      font-size: 64px;
      display: block;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      opacity: 0.85;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 50px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .tip {
      margin-top: 24px;
      font-size: 13px;
      opacity: 0.7;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 6px;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="logo">🌐</span>
    <div class="brand">Tangle-me</div>

    <span class="wifi-icon">📡</span>

    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection.<br>
      Check your Wi-Fi or mobile data, then try again.
    </p>

    <button class="retry-btn" onclick="retryConnection()">
      🔄 Try again
    </button>

    <p class="tip">
      <span class="status-dot"></span>
      No connection detected
    </p>
  </div>

  <script>
    function retryConnection() {
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        window.location.reload();
      }
    }

    // Auto-redirect when connection is restored
    window.addEventListener('online', () => {
      setTimeout(() => { window.location.href = '/'; }, 500);
    });

    // Update status dot when online
    window.addEventListener('online', () => {
      document.querySelector('.status-dot').style.background = '#10b981';
      document.querySelector('.tip').innerHTML =
        '<span class="status-dot" style="background:#10b981"></span> Connection restored — redirecting…';
    });
  </script>
</body>
</html>
